name: Build NEXIVRA Custom Element

on:
  push:
    branches:
      - main
    paths-ignore:
      - "dist/**"

permissions:
  contents: write

concurrency:
  group: nexivra-production-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build NEXIVRA bundle
        run: npm run build

      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/

          if git diff --cached --quiet; then
            echo "No production build changes to commit."
            exit 0
          fi

          git commit -m "Build NEXIVRA production files"

          echo "Synchronizing with latest main before push..."
          git pull --rebase origin main

          echo "Pushing production build..."
          git push origin HEAD:main
